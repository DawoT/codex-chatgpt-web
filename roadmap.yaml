deferred_and_out_of_scope:
  - item: "launcher/src/i18n.ts"
    reason: "Dominated by translation tables; file size alone does not prove mixed responsibilities."
  - item: "src/config.ts"
    reason: "More cohesive than prioritized monoliths; only targeted cleanup if new evidence appears."
  - item: "src/responses/parser.ts"
    reason: "Not currently prioritized over identified orchestration monoliths."
  - item: "src/cli.ts"
    reason: "Not currently prioritized over identified orchestration monoliths."
  - item: "Public API redesign"
    reason: "Requires separate product/compatibility decision."
  - item: "Behavior changes discovered during refactor"
    reason: "Must become separate authorized bug/feature work with independent acceptance criteria."

metrics:
  preferred:
    - name: "facade_stability"
      target: "100% of planned phases preserve the named public facade until an explicit migration."
    - name: "responsibility_cohesion"
      target: "Each extracted collaborator owns one named lifecycle/domain responsibility."
    - name: "contract_test_coverage"
      target: "Every extracted seam has focused executable contract evidence or a documented no-meaningful-RED exception."
    - name: "regression_count"
      target: "0 candidate-caused regressions at phase boundaries."
    - name: "rollback_granularity"
      target: "Every work unit can be reverted without reverting unrelated phases."
    - name: "review_slice_cohesion"
      target: "One responsibility per work-unit/review slice whenever practical."
  prohibited_as_success_metrics:
    - "lines removed"
    - "number of files created"
    - "number of classes created"
    - "percentage reduction in monolith LOC without cohesion evidence"
    - "test count growth without contract value"

definition_of_done:
  roadmap_level:
    - "P0 through P9 exit criteria are satisfied in dependency order."
    - "Every production extraction has baseline, RED/GREEN or approved exception, post-refactor, and review evidence."
    - "All R2 work has the role isolation and governance evidence required by the active harness."
    - "Full repository and launcher gates pass at final integration or pre-existing failures are independently documented."
    - "No hidden public/protocol/auth/concurrency behavior change is bundled into the refactor."
    - "No deferred item is represented as completed."
    - "Delivery authorization remains separate from technical completion."
