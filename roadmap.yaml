      - "Model and reasoning effort selection."
      - "Composer preparation and attachment behavior."
      - "Prompt submission activation/acceptance semantics."
      - "Multipart and compaction behavior."
      - "DOM observation and response extraction."
      - "Retry/diagnostic behavior and exclusive execution."
