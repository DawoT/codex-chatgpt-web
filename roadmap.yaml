    classification:
      risk: "R2"
      size: "L"
      cell: "R2xL"
      triggers: ["browser session lifecycle", "submission/cancellation", "DOM observation", "shared turn state"]
      rationale: "This is the largest behavioral monolith and has many consumers; extraction must be staged behind the facade."
    objective: "Turn ChatGptBrowserWorker into an orchestration facade over browser/session, controls, composer, observers, and diagnostics."
    preserved_contracts:
