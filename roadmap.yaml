      size: "L"
      cell: "R2xL"
      triggers: ["auth/session", "Electron views", "turn lifecycle", "manual Zero Risk control", "shared mutable browser state"]
      rationale: "BrowserHost coordinates privileged UI/browser lifecycle and authentication-sensitive state."
    objective: "Extract internal collaborators without changing the BrowserHost public API."
    preserved_contracts:
      - "View and tab lifecycle."
      - "Navigation behavior."
      - "Authentication and passkey/session behavior."
      - "Automatic and manual/Zero Risk turn control."
      - "Suspension/lease behavior."
      - "Viewport, smoke test, connector verification, and descriptor persistence."
    extraction_seams:
